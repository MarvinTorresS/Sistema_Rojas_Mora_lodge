services:
  mysql:
    image: mysql:8.4
    container_name: rojas_mora_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root1234
      TZ: America/Costa_Rica

    ports:
      - "3306:3306"

    volumes:
      - rojas_mora_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  rojas_mora_mysql_data:
