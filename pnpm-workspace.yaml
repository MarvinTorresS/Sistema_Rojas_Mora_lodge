packages:
  - "backend"
  - "frontend"

# Paquetes con scripts postinstall aprobados explicitamente, tras revisar
# que son legitimos y necesarios (ver README.md, seccion de seguridad).
# NUNCA agregar un paquete aqui sin revisarlo primero.
allowBuilds:
  bcrypt: true # compila su binario nativo, lo usamos para hashear contrasenas
  esbuild: true # dependencia interna de Vite, compila su propio binario

minimumReleaseAgeExclude:
  - lucide-react@1.44.0
